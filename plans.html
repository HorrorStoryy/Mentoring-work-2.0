<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>План и результат - Система наставничества</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .plan-form {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-field {
            display: flex;
            flex-direction: column;
        }
        
        .form-field label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .form-field input,
        .form-field textarea,
        .form-field select {
            padding: 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9375rem;
        }
        
        .form-field textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .form-field input:focus,
        .form-field textarea:focus,
        .form-field select:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }
        
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .link-item {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .link-item input {
            flex: 1;
        }
        
        .link-item button {
            padding: 0.5rem 0.75rem;
            background: var(--danger);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            cursor: pointer;
            font-size: 0.875rem;
        }
        
        .add-link-btn {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        
        .add-link-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        
        .plan-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .plan-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .plan-card-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .plan-section {
            margin-bottom: 1.5rem;
        }
        
        .plan-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        
        .plan-section-content {
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .competencies-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .competency-tag {
            padding: 0.375rem 0.75rem;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 12px;
            font-size: 0.8125rem;
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎯 Наставничество</h2>
                <p class="user-role" id="userName">Загрузка...</p>
            </div>
            
            <div class="month-selector">
                <label for="monthSelect">Период</label>
                <select id="monthSelect">
                    <option value="2026-09">Сентябрь 2026</option>
                    <option value="2026-08">Август 2026</option>
                    <option value="2026-07">Июль 2026</option>
                    <option value="2026-06">Июнь 2026</option>
                </select>
            </div>
            
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Главная
                </a>
                
                <a href="analytics.html" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    Показатели
                </a>
                
                <a href="plans.html" class="nav-item active">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    План и результат
                </a>
                
                <a href="employee-history.html" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    История сотрудников
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button onclick="window.authModule.logout()" class="btn btn-secondary" style="width: 100%;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 16px; height: 16px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Выход
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>План работы и результат</h1>
                <p>Управление планами развития сотрудников</p>
            </div>
            
            <div id="plansContainer">
                <!-- Планы будут загружены через JS -->
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script>
        const currentUser = window.authModule.checkAuth();
        if (!currentUser) {
            window.location.href = 'index.html';
        }
        
        document.getElementById('userName').textContent = currentUser.name;
        
        let currentDatabase = null;
        let editingEmployeeId = null;
        
        // Проверяем, есть ли параметр id в URL для редактирования конкретного сотрудника
        const urlParams = new URLSearchParams(window.location.search);
        const employeeIdFromUrl = urlParams.get('id');
        
        async function loadPlans() {
            const database = await window.authModule.loadDatabase();
            if (!database) return;
            
            currentDatabase = database;
            
            let employees = database.employees;
            if (currentUser.role === 'vs') {
                employees = employees.filter(emp => emp.vs_id === currentUser.id);
            }
            
            // Если есть id в URL, показываем только форму редактирования этого сотрудника
            if (employeeIdFromUrl) {
                const employee = employees.find(e => e.id === parseInt(employeeIdFromUrl));
                if (employee) {
                    showEditForm(employee);
                    return;
                }
            }
            
            // Иначе показываем все планы
            const container = document.getElementById('plansContainer');
            container.innerHTML = '';
            
            employees.forEach(emp => {
                const card = createPlanCard(emp);
                container.appendChild(card);
            });
        }
        
        function createPlanCard(employee) {
            const card = document.createElement('div');
            card.className = 'plan-card';
            
            const plan = employee.current_plan;
            const statusBadge = plan.status === 'approved' 
                ? '<span class="status-badge approved">✓ Утверждён</span>'
                : '<span class="status-badge draft">⏱ Черновик</span>';
            
            card.innerHTML = `
                <div class="plan-card-header">
                    <div>
                        <div class="plan-card-title">${employee.name}</div>
                        <div class="text-muted" style="font-size: 0.875rem;">Ведущий: ${employee.vs}</div>
                    </div>
                    ${statusBadge}
                </div>
                
                ${plan.complaints && plan.complaints.length > 0 ? `
                <div class="plan-section">
                    <div class="plan-section-title">Жалобы/Инциденты</div>
                    <div class="plan-section-content">
                        ${plan.complaints.map(link => `
                            <div><a href="${link}" target="_blank" style="color: var(--accent-cyan); text-decoration: none;">${link}</a></div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}
                
                ${plan.incidents_sum ? `
                <div class="plan-section">
                    <div class="plan-section-title">Залёты</div>
                    <div class="plan-section-content">
                        <span class="badge badge-danger">${plan.incidents_sum.toFixed(2)} ₽</span>
                    </div>
                </div>
                ` : ''}
                
                ${plan.competencies && plan.competencies.length > 0 ? `
                <div class="plan-section">
                    <div class="plan-section-title">Компетенции для развития</div>
                    <div class="competencies-list">
                        ${plan.competencies.map(c => `<span class="competency-tag">${c}</span>`).join('')}
                    </div>
                </div>
                ` : ''}
                
                <div class="plan-section">
                    <div class="plan-section-title">Ожидаемый результат</div>
                    <div class="plan-section-content">${plan.expected_result || '—'}</div>
                </div>
                
                <div class="plan-section">
                    <div class="plan-section-title">План работы</div>
                    <div class="plan-section-content" style="white-space: pre-line;">${plan.action_plan || '—'}</div>
                </div>
                
                ${plan.result ? `
                <div class="plan-section">
                    <div class="plan-section-title">Итог</div>
                    <div class="plan-section-content">${plan.result}</div>
                </div>
                ` : ''}
                
                <div class="form-actions" style="border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem;">
                    <button onclick="editPlan(${employee.id})" class="btn btn-secondary">
                        ✏️ Редактировать
                    </button>
                    ${plan.status === 'draft' ? `
                        <button onclick="submitPlan(${employee.id})" class="btn btn-orange">
                            📤 Отправить на согласование
                        </button>
                    ` : ''}
                </div>
            `;
            
            return card;
        }
        
        function showEditForm(employee) {
            const container = document.getElementById('plansContainer');
            const plan = employee.current_plan;
            editingEmployeeId = employee.id;
            
            const complaintsHtml = (plan.complaints || []).map((link, index) => `
                <div class="link-item">
                    <input type="text" value="${link}" id="complaint_${index}" placeholder="https://tracker.yandex.ru/CLAIM-XXXXX">
                    <button type="button" onclick="removeComplaint(${index})">Удалить</button>
                </div>
            `).join('');
            
            const competenciesValue = (plan.competencies || []).join(', ');
            
            container.innerHTML = `
                <div class="plan-form">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <div>
                            <h2>${employee.name}</h2>
                            <p class="text-muted">План работы на ${document.getElementById('monthSelect').options[document.getElementById('monthSelect').selectedIndex].text}</p>
                        </div>
                        <button onclick="cancelEdit()" class="btn btn-secondary">← Назад</button>
                    </div>
                    
                    <form id="planForm">
                        <div class="form-row">
                            <div class="form-field">
                                <label>Жалобы/Инциденты</label>
                                <div class="links-list" id="complaintsList">
                                    ${complaintsHtml}
                                </div>
                                <button type="button" class="add-link-btn" onclick="addComplaint()">+ Добавить ссылку</button>
                            </div>
                            
                            <div class="form-field">
                                <label>Сумма залётов (₽)</label>
                                <input type="number" id="incidents_sum" value="${plan.incidents_sum || 0}" step="0.01" placeholder="0.00">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-field">
                                <label>Компетенции для развития (через запятую)</label>
                                <input type="text" id="competencies" value="${competenciesValue}" placeholder="Качество обслуживания, Управление временем">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-field">
                                <label>Ожидаемый результат</label>
                                <textarea id="expected_result" placeholder="Какого результата ожидаем к концу месяца?">${plan.expected_result || ''}</textarea>
                            </div>
                            
                            <div class="form-field">
                                <label>План работы</label>
                                <textarea id="action_plan" placeholder="Конкретные действия и шаги для достижения результата">${plan.action_plan || ''}</textarea>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-field">
                                <label>Итог (заполняется по окончании месяца)</label>
                                <textarea id="result" placeholder="Итоговый результат выполнения плана">${plan.result || ''}</textarea>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" onclick="cancelEdit()" class="btn btn-secondary">Отменить</button>
                            <button type="button" onclick="saveDraft()" class="btn btn-secondary">💾 Сохранить черновик</button>
                            <button type="submit" class="btn btn-orange">📤 Сохранить и отправить</button>
                        </div>
                    </form>
                </div>
            `;
            
            document.getElementById('planForm').addEventListener('submit', (e) => {
                e.preventDefault();
                savePlan(true);
            });
        }
        
        function addComplaint() {
            const list = document.getElementById('complaintsList');
            const index = list.children.length;
            const div = document.createElement('div');
            div.className = 'link-item';
            div.innerHTML = `
                <input type="text" id="complaint_${index}" placeholder="https://tracker.yandex.ru/CLAIM-XXXXX">
                <button type="button" onclick="removeComplaint(${index})">Удалить</button>
            `;
            list.appendChild(div);
        }
        
        function removeComplaint(index) {
            const element = document.getElementById(`complaint_${index}`).parentElement;
            element.remove();
        }
        
        function saveDraft() {
            savePlan(false);
        }
        
        function savePlan(submit) {
            // Собираем данные формы
            const complaints = [];
            document.querySelectorAll('[id^="complaint_"]').forEach(input => {
                if (input.value.trim()) complaints.push(input.value.trim());
            });
            
            const competenciesText = document.getElementById('competencies').value;
            const competencies = competenciesText.split(',').map(c => c.trim()).filter(c => c);
            
            const planData = {
                complaints,
                incidents_sum: parseFloat(document.getElementById('incidents_sum').value) || 0,
                competencies,
                expected_result: document.getElementById('expected_result').value,
                action_plan: document.getElementById('action_plan').value,
                result: document.getElementById('result').value,
                status: submit ? 'pending' : 'draft'
            };
            
            // В реальном приложении здесь был бы запрос к серверу
            console.log('Сохранение плана:', planData);
            
            alert(submit ? 'План отправлен на согласование!' : 'Черновик сохранён!');
            
            if (submit) {
                window.location.href = 'plans.html';
            }
        }
        
        function cancelEdit() {
            if (employeeIdFromUrl) {
                window.location.href = 'plans.html';
            } else {
                loadPlans();
            }
        }
        
        function editPlan(employeeId) {
            const employee = currentDatabase.employees.find(e => e.id === employeeId);
            if (employee) {
                showEditForm(employee);
            }
        }
        
        function submitPlan(employeeId) {
            if (confirm('Отправить план на согласование РГ?')) {
                alert('План отправлен на согласование!');
                loadPlans();
            }
        }
        
        loadPlans();
    </script>
</body>
</html>
