<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Система наставничества</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <h1>🎯 Система наставничества</h1>
                <p>Управление развитием сотрудников</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" placeholder="Введите логин" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    Войти
                </button>
            </form>
            
            <div id="error-message" style="margin-top: 1rem; color: #EF4444; font-size: 0.875rem; display: none;"></div>
            
            <div style="margin-top: 2rem; padding: 1rem; background: rgba(34, 211, 238, 0.1); border-radius: 8px; border: 1px solid rgba(34, 211, 238, 0.2);">
                <p style="font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 0.5rem;"><strong>Тестовые аккаунты:</strong></p>
                <p style="font-size: 0.75rem; color: var(--text-secondary);">👤 admin / admin123 (Админ)</p>
                <p style="font-size: 0.75rem; color: var(--text-secondary);">👤 bordakova / vs123 (ВС)</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
