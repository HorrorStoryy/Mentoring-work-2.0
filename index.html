<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наставничество — Smartway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ================== ЭКРАН ВХОДА ================== -->
<div class="auth" id="auth">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">SW</div>
      <div class="brand-name">Наставничество</div>
    </div>
    <div class="auth-sub">Система контроля показателей и развития сотрудников</div>

    <form id="loginForm">
      <div class="field">
        <label for="login">Логин</label>
        <input type="text" id="login" autocomplete="username" placeholder="например, bordakova" required>
      </div>
      <div class="field">
        <label for="pass">Пароль</label>
        <input type="password" id="pass" autocomplete="current-password" placeholder="••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="padding:11px">Войти в систему</button>
    </form>
    <div class="err" id="loginErr"></div>

    <div class="demo-box">
      <b>Тестовые доступы</b>
      <div id="demoAccounts"></div>
    </div>
  </div>
</div>

<!-- ================== ПРИЛОЖЕНИЕ ================== -->
<div class="app" id="app">
  <div class="shell">

    <aside class="side" id="side">
      <div class="side-top">
        <div class="side-brand">
          <div class="brand-mark">SW</div>
          <span>Наставничество</span>
        </div>
        <div class="side-user">
          <div class="av" id="uAv">—</div>
          <div class="who">
            <div class="nm" id="uName">—</div>
            <div class="rl" id="uRole">—</div>
          </div>
        </div>
      </div>

      <div class="side-period">
        <div class="side-cap" style="padding-left:0">Период</div>
        <select id="monthSel"></select>
      </div>

      <div class="side-scroll">
        <div class="side-cap">Разделы</div>
        <button class="nav on" data-page="dashboard">
          <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v6a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 2a2 2 0 012-2h2a2 2 0 012 2v.01a2 2 0 01-2 2h-2a2 2 0 01-2-2V18z"/></svg>
          Главная
        </button>
        <button class="nav" data-page="metrics">
          <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 20h18M6 20V10m5 10V4m5 16v-7"/></svg>
          Показатели
        </button>
        <button class="nav" data-page="plans">
          <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 8h3m-3 4h3M9 13h.01M9 17h.01"/></svg>
          План и результат
        </button>
        <button class="nav" data-page="history">
          <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l2.5 2.5M21 12a9 9 0 11-3.2-6.9M21 4v4h-4"/></svg>
          История сотрудников
        </button>

        <div class="side-cap" id="capManage">Управление</div>
        <button class="nav" data-page="users" id="navUsers">
          <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 19v-1a3 3 0 00-3-3H7a3 3 0 00-3 3v1m14-6a3 3 0 100-6 3 3 0 000 6zm-7-2a3 3 0 100-6 3 3 0 000 6z"/></svg>
          Пользователи
        </button>
        <button class="nav" data-page="log" id="navLog">
          <svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          История изменений
        </button>
      </div>

      <div class="side-bottom">
        <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17l5-5-5-5M20 12H9m2 8H6a2 2 0 01-2-2V6a2 2 0 012-2h5"/></svg>
          Выйти
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">
      <div class="topbar">
        <button class="burger" id="burger">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title">
          <h2 id="pageTitle">Главная</h2>
          <p id="pageSub">—</p>
        </div>
        <div class="topbar-right">
          <div class="search" id="searchWrap" style="display:none"></div>
        </div>
      </div>

      <div class="page" id="view"></div>
    </div>

  </div>
</div>

<div id="modalHost"></div>
<div class="toast-wrap" id="toasts"></div>

<script src="data/database.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
